# CI & Deploy workflow for main branch
#
# Prerequisites — GCP setup (run once):
#
#   # 1. Create Workload Identity Pool
#   gcloud iam workload-identity-pools create "github-actions" \
#     --project="xxxserver" \
#     --location="global" \
#     --display-name="GitHub Actions"
#
#   # 2. Create OIDC Provider (restrict to this repo)
#   gcloud iam workload-identity-pools providers create-oidc "github" \
#     --project="xxxserver" \
#     --location="global" \
#     --workload-identity-pool="github-actions" \
#     --display-name="GitHub" \
#     --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository" \
#     --attribute-condition="assertion.repository == 'azyobuzin/xxx-info'" \
#     --issuer-uri="https://token.actions.githubusercontent.com"
#
#   # 3. Create service account
#   gcloud iam service-accounts create github-actions-deploy \
#     --project="xxxserver" \
#     --display-name="GitHub Actions Deploy"
#
#   # 4. Grant IAM roles
#   SA="github-actions-deploy@xxxserver.iam.gserviceaccount.com"
#
#   for role in roles/run.admin roles/cloudbuild.builds.editor roles/storage.objectCreator \
#     roles/artifactregistry.writer roles/firebasehosting.admin roles/firebase.viewer; do
#     gcloud projects add-iam-policy-binding xxxserver \
#       --member="serviceAccount:$SA" --role="$role"
#   done
#
#   # Allow SA to act as the Cloud Run runtime SA and Cloud Build default SA
#   for target in xxx-info-api@xxxserver.iam.gserviceaccount.com \
#     665883790690-compute@developer.gserviceaccount.com; do
#     gcloud iam service-accounts add-iam-policy-binding "$target" \
#       --member="serviceAccount:$SA" \
#       --role="roles/iam.serviceAccountUser"
#   done
#
#   # 5. Allow WIF to impersonate the service account
#   gcloud iam service-accounts add-iam-policy-binding "$SA" \
#     --project="xxxserver" \
#     --role="roles/iam.workloadIdentityUser" \
#     --member="principalSet://iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github-actions/attribute.repository/azyobuzin/xxx-info"
#
#   # 6. Set GitHub repository variables (Settings > Variables > Actions):
#   #   GCP_PROJECT_NUMBER  — your numeric project number
#   #   WIF_POOL            — github-actions
#   #   WIF_PROVIDER        — github
#   #   GCP_SERVICE_ACCOUNT — github-actions-deploy@xxxserver.iam.gserviceaccount.com

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deploy target"
        required: true
        type: choice
        options:
          - api
          - website
          - both

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy_api: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        (inputs.deploy_target == 'api' || inputs.deploy_target == 'both') ||
        github.event_name == 'push' && steps.filter.outputs.api == 'true' }}
      deploy_website: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        (inputs.deploy_target == 'website' || inputs.deploy_target == 'both') ||
        github.event_name == 'push' &&
        (steps.filter.outputs.api == 'true' || steps.filter.outputs.website == 'true') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Manual runs use deploy_target instead of changed paths.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'Dockerfile'
              - '.gcloudignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            website:
              - 'apps/website/**'
              - 'apps/api/src/client.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm exec biome ci

  deploy-api:
    needs: [changes, ci]
    if: needs.changes.outputs.deploy_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.WIF_POOL }}/providers/${{ vars.WIF_PROVIDER }}"
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: xxx-info-api
          region: asia-east1
          source: .

  deploy-website:
    needs: [changes, ci, deploy-api]
    if: >-
      always() && needs.ci.result == 'success' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      needs.changes.outputs.deploy_website == 'true'
    environment:
      name: production
      url: https://xxx-info.azyobuzi.net
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.WIF_POOL }}/providers/${{ vars.WIF_PROVIDER }}"
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @xxx-info/website exec firebase deploy --non-interactive
